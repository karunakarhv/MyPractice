openapi: 3.0.0
info:
  title: Hello World API
  description: A simple API that returns a greeting
  version: 1.0.0
paths:
  '/hello':
    get:
      summary: Returns a greeting
      operationId: getGreeting
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello world!
